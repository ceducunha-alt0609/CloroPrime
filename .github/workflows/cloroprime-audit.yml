name: CloroPrime audit
on:
  push:
    paths:
      - 'cloroprime_audit.py'
      - '.github/workflows/cloroprime-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python cloroprime_audit.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloroprime_audit_report.txt
          git diff --cached --quiet || git commit -m 'Generate CloroPrime audit report'
          git push
