name: CloroPrime consistency patch
on:
  push:
    paths:
      - 'cloroprime_patch_consistency.py'
      - '.github/workflows/cloroprime-consistency-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python cloroprime_patch_consistency.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Align CloroPrime dosing guidance and collection bands'
          git push
