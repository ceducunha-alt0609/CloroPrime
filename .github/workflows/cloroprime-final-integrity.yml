name: CloroPrime final integrity
on:
  push:
    paths:
      - 'cloroprime_patch_final_integrity.py'
      - '.github/workflows/cloroprime-final-integrity.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python cloroprime_patch_final_integrity.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix CloroPrime costs dates and refill integrity'
          git push
